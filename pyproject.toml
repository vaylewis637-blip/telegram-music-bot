[project]
name = "telegram-music-bot"
version = "0.1.0"
description = "An aiogram 3 Telegram bot with CAPTCHA, required channel checks, and music search."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.20,<1",
    "mutagen>=1.47,<2",
    "pillow>=10,<13",
    "pydub>=0.25.1,<1",
]

[tool.uv]
package = false
